---

- name: "restore LazyVim plugins"
  lazy_plugins:
    lock_file: "{{ dotfiles.checkout }}/config/private_dot_config/nvim/lazy-lock.json"
    plugin_root: "{{ ansible_facts['user_dir'] }}/.local/share/nvim/lazy"
    active_lock_file: "{{ ansible_facts['user_dir'] }}/.config/nvim/lazy-lock.json"
    install_argv:
      - mise
      - exec
      - --
      - nvim
      - --headless
      - "+Lazy! install"
      - +qa
    restore_argv:
      - mise
      - exec
      - --
      - nvim
      - --headless
      - "+Lazy! restore"
      - +qa
    verify_argv:
      - mise
      - exec
      - --
      - nvim
      - --headless
      - +qa
