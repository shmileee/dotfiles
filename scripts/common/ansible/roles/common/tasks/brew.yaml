---

- name: "brew | list packages"
  ansible.builtin.debug:
    msg: "{{ pkgs }}"
  when: pkgs is defined

- name: "brew | list taps"
  ansible.builtin.command: brew tap
  register: brew_taps
  changed_when: false
  when: ansible_system == "Linux"

- name: "brew | remove legacy core tap"
  ansible.builtin.command: brew untap --force homebrew/core
  when:
    - ansible_system == "Linux"
    - "'homebrew/core' in (brew_taps.stdout_lines | default([]))"

- name: "brew | update"
  community.general.homebrew:
    update_homebrew: true

- name: "brew | install taps"
  community.general.homebrew_tap:
    name: "{{ brew.taps }}"
    state: present
    trust: true
  when: brew.taps is defined

- name: "brew | install casks"
  community.general.homebrew_cask:
    name: "{{ brew.casks }}"
    state: present
    greedy: true
    accept_external_apps: true
  when:
    - brew.casks is defined
    - ansible_system == "Darwin"

- name: "brew | install packages"
  community.general.homebrew:
    name: "{{ pkgs }}"
  when: pkgs is defined

- name: "brew | install packages from source"
  community.general.homebrew:
    name: "{{ brew.packages_from_source }}"
    install_options: build-from-source
  when: brew.packages_from_source is defined
