---

- name: "brew | update"
  community.general.homebrew:
    update_homebrew: true
  when: not dockerized

- name: "brew | install taps"
  community.general.homebrew_tap:
    name: "{{ brew.taps }}"
    state: present
    trust: true

- name: "brew | install casks"
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: latest
    accept_external_apps: true
  loop: "{{ brew.casks }}"
  register: brew_cask_result
  # community.general 13.3.0 only recognizes Homebrew's old unprefixed
  # external-app message. Homebrew 6 prefixes it with the cask token.
  failed_when:
    - brew_cask_result is failed
    - "'It seems there is already an App at' not in brew_cask_result.msg"
  when:
    - ansible_facts["system"] == "Darwin"

- name: "brew | install packages"
  community.general.homebrew:
    name: "{{ pkgs }}"
    state: latest
