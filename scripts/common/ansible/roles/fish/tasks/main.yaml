---

- name: "install"
  community.general.homebrew:
    name:
      - 'fish'
  tags: homebrew

- block:
    - name: "obtain path to fish"
      ansible.builtin.command: which fish
      register: fish_path
      changed_when: false

    - name: "change default shell to fish"
      become: true
      ansible.builtin.user:
        name: '{{ ansible_user }}'
        shell: '{{ fish_path.stdout }}'

  tags: fish_chsh

- block:
    - name: "create fish config dir"
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/fish"
        state: directory
        mode: '0700'

    - name: "obtain path to fish"
      ansible.builtin.command: which fish
      register: fish_path
      changed_when: false
      check_mode: false

    - name: "create functions dir"
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/fish/functions"
        state: directory
        mode: '0755'

    - name: "install fisher"
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish
        dest: "{{ ansible_facts['user_dir'] }}/.config/fish/functions/fisher.fish"
        mode: '0755'
      register: download_result
      until: download_result is succeeded
      retries: 3
      delay: 5

    - name: "list fisher plugins"
      ansible.builtin.command:
        argv:
          - '{{ fish_path.stdout }}'
          - -c
          - fisher list
      register: fisher_plugins
      changed_when: false
      failed_when: fisher_plugins.rc not in [0, 1]

    - name: "update fisher plugins"
      ansible.builtin.command:
        argv:
          - '{{ fish_path.stdout }}'
          - -c
          - fisher update
      when: >-
        download_result.changed or
        fisher_plugins.stdout_lines | map('lower') | list !=
        lookup('ansible.builtin.file', ansible_facts['user_dir'] + '/.config/fish/fish_plugins').splitlines()
        | map('lower') | list

  tags: fish_config
