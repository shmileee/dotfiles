---

- name: "install"
  community.general.homebrew:
    name:
      - 'fish'
    state: latest
  tags: homebrew

- name: "set path to fish"
  ansible.builtin.set_fact:
    fish_path: >-
      {{
        (
          '/home/linuxbrew/.linuxbrew'
          if ansible_facts['system'] == 'Linux'
          else ('/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local')
        ) + '/bin/fish'
      }}

- name: "configure fish as the login shell"
  block:
    - name: "change default shell to fish"
      become: true
      ansible.builtin.user:
        name: '{{ ansible_user }}'
        shell: '{{ fish_path }}'

  tags: fish_chsh

- name: "configure fish and fisher"
  block:
    - name: "create fish config dir"
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/fish"
        state: directory
        mode: '0700'

    - name: "create functions dir"
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/fish/functions"
        state: directory
        mode: '0755'

    - name: "install fisher"
      ansible.builtin.get_url:
        # Fisher 4.4.8. Bump this reviewed manager commit manually.
        url: https://raw.githubusercontent.com/jorgebucaran/fisher/a04308be92daa6cfecdbb0ca58b1e8508664cff2/functions/fisher.fish
        dest: "{{ ansible_facts['user_dir'] }}/.config/fish/functions/fisher.fish"
        mode: '0755'
      register: download_result
      until: download_result is succeeded
      retries: 3
      delay: 5

    - name: "reconcile fisher plugins"
      # fish-async-prompt stays commit-pinned until prompt callbacks preserve
      # pipeline status reliably.
      command_reconcile:
        probe_argv: ['{{ fish_path }}', -c, fisher list]
        apply_argv: ['{{ fish_path }}', -c, fisher update]
        comparison: lines
        desired_lines: >-
          {{
            lookup(
              'ansible.builtin.file',
              dotfiles.checkout + '/config/private_dot_config/private_fish/private_fish_plugins'
            ).splitlines()
          }}
        normalize_case: true
        sort_lines: true
        probe_failure_means_changed_in_check: true
        probe_success_rc: [0, 1]

  tags: fish_config
