---

- name: "install chezmoi"
  community.general.homebrew:
    name:
      - chezmoi
    state: latest
  tags: homebrew

- name: "chezmoi init"
  ansible.builtin.command:
    argv:
      - chezmoi
      - init
      - "{{ dotfiles.repo }}"
      - --branch
      - "{{ dotfiles.branch }}"
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.local/share/chezmoi"

- name: "chezmoi apply current checkout"
  command_reconcile:
    probe_argv:
      - chezmoi
      - --source
      - "{{ dotfiles.checkout }}/config"
      - --working-tree
      - "{{ dotfiles.checkout }}"
      - status
    apply_argv:
      - chezmoi
      - --source
      - "{{ dotfiles.checkout }}/config"
      - --working-tree
      - "{{ dotfiles.checkout }}"
      - apply
      - --force
      - --verbose
    comparison: empty
