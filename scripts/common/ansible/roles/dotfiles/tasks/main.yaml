---

- name: "install chezmoi"
  community.general.homebrew:
    name:
      - chezmoi
    state: latest
  tags: homebrew

- name: "chezmoi init"
  ansible.builtin.command:
    argv:
      - chezmoi
      - init
      - "{{ dotfiles.repo }}"
      - --branch
      - "{{ dotfiles.branch }}"
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.local/share/chezmoi"

- name: "chezmoi apply current checkout"
  ansible.builtin.command:
    argv:
      - chezmoi
      - --source
      - "{{ dotfiles.checkout }}/config"
      - --working-tree
      - "{{ dotfiles.checkout }}"
      - apply
      - --force
      - --verbose
  register: chezmoi_apply
  changed_when: chezmoi_apply.stdout | trim | length > 0
