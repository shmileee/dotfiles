---

homebrew_prefix: >-
  {{
    '/home/linuxbrew/.linuxbrew'
    if ansible_facts['system'] == 'Linux'
    else '/opt/homebrew'
  }}
homebrew_executable: "{{ homebrew_prefix }}/bin/brew"
homebrew_macos_installer_url: >-
  https://github.com/Homebrew/brew/releases/latest/download/Homebrew.pkg
homebrew_linux_installer_url: >-
  https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
