---

- name: "homebrew | prepare the user-owned linux prefix"
  become: true
  ansible.builtin.file:
    path: "{{ homebrew_prefix }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0755"

- name: "homebrew | install with the official linux script"
  block:
    - name: "homebrew | allocate a temporary linux installer"
      ansible.builtin.tempfile:
        state: file
        suffix: homebrew-install.sh
      register: homebrew_linux_installer

    - name: "homebrew | download the current official linux installer"
      ansible.builtin.get_url:
        url: "{{ homebrew_linux_installer_url }}"
        dest: "{{ homebrew_linux_installer.path }}"
        mode: "0700"

    - name: "homebrew | run the official linux installer"
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ homebrew_linux_installer.path }}"
        creates: "{{ homebrew_executable }}"
      environment:
        CI: "1"
        NONINTERACTIVE: "1"
        HOMEBREW_NO_ANALYTICS: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
  always:
    - name: "homebrew | remove the temporary linux installer"
      ansible.builtin.file:
        path: "{{ homebrew_linux_installer.path | default('') }}"
        state: absent
      when:
        - homebrew_linux_installer is defined
        - homebrew_linux_installer.path is defined
