---

- name: "bootstrap prerequisites | assert a supported workstation target"
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts['system'] == 'Darwin' and ansible_facts['architecture'] == 'arm64')
        or
        (ansible_facts['system'] == 'Linux'
         and ansible_facts['distribution'] == 'Ubuntu'
         and ansible_facts['distribution_version'] == '24.04'
         and ansible_facts['architecture'] in ['aarch64', 'arm64'])
    fail_msg: >-
      Supported targets are Apple Silicon macOS and Ubuntu 24.04 ARM64.
      No workstation packages have been installed.

- name: "bootstrap prerequisites | verify macos command line tools"
  ansible.builtin.command: xcode-select -p
  changed_when: false
  when: ansible_facts['system'] == 'Darwin'

- name: "bootstrap prerequisites | install ubuntu native prerequisites"
  become: true
  ansible.builtin.apt:
    name: "{{ bootstrap_native_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: ansible_facts['system'] == 'Linux'

- name: "bootstrap prerequisites | create the persistent checkout parent"
  ansible.builtin.file:
    path: "{{ persistent_checkout | dirname }}"
    state: directory
    mode: "0755"

- name: "bootstrap prerequisites | inspect the persistent checkout path"
  ansible.builtin.stat:
    path: "{{ persistent_checkout }}"
  register: persistent_checkout_path

- name: "bootstrap prerequisites | validate an existing persistent checkout"
  when: persistent_checkout_path.stat.exists
  block:
    - name: "bootstrap prerequisites | verify the occupant is the checkout root"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ persistent_checkout }}"
          - rev-parse
          - --show-toplevel
      register: checkout_root
      changed_when: false
      failed_when: checkout_root.rc != 0 or checkout_root.stdout != persistent_checkout

    - name: "bootstrap prerequisites | verify the persistent checkout origin"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ persistent_checkout }}"
          - remote
          - get-url
          - origin
      register: checkout_origin
      changed_when: false
      failed_when: checkout_origin.rc != 0 or checkout_origin.stdout != 'https://github.com/shmileee/dotfiles.git'

    - name: "bootstrap prerequisites | inspect the remote partial-clone marker"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ persistent_checkout }}"
          - config
          - --local
          - --get
          - remote.origin.promisor
      register: remote_promisor
      changed_when: false
      failed_when: remote_promisor.rc not in [0, 1]

    - name: "bootstrap prerequisites | inspect the repository partial-clone extension"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ persistent_checkout }}"
          - config
          - --local
          - --get
          - extensions.partialClone
      register: partial_clone_extension
      changed_when: false
      failed_when: partial_clone_extension.rc not in [0, 1]

    - name: "bootstrap prerequisites | inspect the shallow-clone marker"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ persistent_checkout }}"
          - rev-parse
          - --is-shallow-repository
      register: shallow_repository
      changed_when: false

    - name: "bootstrap prerequisites | reject an incomplete persistent clone"
      ansible.builtin.assert:
        that:
          - remote_promisor.stdout | trim | lower not in ['true', '1', 'yes']
          - partial_clone_extension.stdout | trim | length == 0
          - shallow_repository.stdout | trim | lower == 'false'
        fail_msg: >-
          The persistent path is a partial or shallow clone. Move or remove it
          manually; bootstrap never repairs or deletes an occupied path.

- name: "bootstrap prerequisites | clone the full persistent repository"
  ansible.builtin.git:
    repo: https://github.com/shmileee/dotfiles.git
    dest: "{{ persistent_checkout }}"
    version: master
    update: false
  when: not persistent_checkout_path.stat.exists

- name: "bootstrap prerequisites | read the persistent checkout commit"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ persistent_checkout }}"
      - rev-parse
      - HEAD
  register: persistent_commit
  changed_when: false

- name: "bootstrap prerequisites | report the persistent checkout commit"
  ansible.builtin.debug:
    msg: "Persistent checkout commit: {{ persistent_commit.stdout }}"
