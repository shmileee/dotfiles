---
- name: Configure workstation
  hosts: 127.0.0.1
  strategy: linear
  connection: local

  vars_files:
    - config.yaml

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    dockerized: "{{ lookup('ansible.builtin.env', 'DOCKERIZED') == 'true' }}"

  roles:
    - role: common
      tags: common

    - role: fonts
      tags: fonts

    - role: dotfiles
      tags: dotfiles

    - role: fish
      tags: fish

    - role: mise
      tags: mise

    - role: neovim
      tags: neovim

    - role: docker
      tags: docker
      when: not dockerized

    - role: tmux
      tags: tmux

    - role: system_defaults
      tags: system_defaults
