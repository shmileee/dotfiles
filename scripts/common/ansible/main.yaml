---
- name: "configure workstation"
  hosts: 127.0.0.1
  strategy: linear
  connection: local

  vars_files:
    - config.yaml

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    dockerized: "{{ lookup('ansible.builtin.env', 'DOCKERIZED') == 'true' }}"
    persistent_checkout: >-
      {{
        lookup('ansible.builtin.env', 'DOTFILES_PERSISTENT_CHECKOUT')
        | default(ansible_facts['user_dir'] + '/ghq/personalgit/shmileee/dotfiles', true)
      }}
  environment:
    PATH: >-
      {{
        '/opt/homebrew/bin:/opt/homebrew/sbin:'
        + '/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:'
        + lookup('ansible.builtin.env', 'PATH')
      }}
  roles:
    - role: bootstrap_prerequisites
      tags: bootstrap_prerequisites

    - role: homebrew
      tags: homebrew

    - role: common
      tags: common

    - role: fonts
      tags: fonts

    - role: dotfiles
      tags: dotfiles

    - role: fish
      tags: fish

    - role: mise
      tags: mise

    - role: neovim
      tags: neovim

    - role: docker
      tags: docker
      when: not dockerized

    - role: tmux
      tags: tmux

    - role: system_defaults
      tags: system_defaults

    - role: handoff
      tags: handoff
