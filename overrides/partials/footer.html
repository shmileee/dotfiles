<footer class="site-footer">
  {% if "navigation.footer" in features and (page.previous_page or page.next_page) %}
    <nav class="docs-adjacent" aria-label="Documentation navigation">
      {% if page.previous_page %}
        <a href="{{ page.previous_page.url | url }}">
          <span>Previous</span>
          <strong>{{ page.previous_page.title }}</strong>
        </a>
      {% endif %}
      {% if page.next_page %}
        <a class="docs-adjacent-next" href="{{ page.next_page.url | url }}">
          <span>Next</span>
          <strong>{{ page.next_page.title }}</strong>
        </a>
      {% endif %}
    </nav>
  {% endif %}
  <div class="footer-inner">
    <p class="footer-copyright">{{ config.copyright }}</p>
  </div>
</footer>
