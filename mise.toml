[settings]
experimental = true
legacy_version_file = false

[tools]
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:twpayne/chezmoi" = "2.72.0"
"aqua:zizmorcore/zizmor" = "1.29.0"
biome = "2.5.11"
gitleaks = "8.30.1"
"pipx:ansible-core" = "2.21.3"
"pipx:ansible-lint" = "26.8.0"
"pipx:yamllint" = "1.38.0"
prek = "0.4.14"
rumdl = "0.2.62"
ruff = "0.16.5"
shellcheck = "0.11.0"
shfmt = "3.13.1"
stylua = "2.5.2"
taplo = "0.10.0"
uv = "0.12.6"

[tasks.docs]
description = "Preview the documentation at http://localhost:8000"
run = "uv run --python 3.14 --with-requirements requirements-docs.txt zensical serve"
raw = true

[tasks."docs:build"]
description = "Build the documentation with CI's strict settings"
run = """
uv run --python 3.14 --with-requirements requirements-docs.txt zensical build --strict
uv run --python 3.14 python scripts/version_docs_assets.py
"""

[tasks.reconcile]
description = "Install Ansible collections and reconcile this machine"
run = "scripts/common/ansible.sh --all"
raw = true

[tasks."reconcile:check"]
description = "Preview the Ansible reconciliation (check mode has limits)"
run = "scripts/common/ansible.sh --all --check"
raw = true

[tasks.import]
description = "Import modified managed files from $HOME into config/"
run = "chezmoi re-add"
raw = true

[tasks.status]
description = "Show differences between config/ and the files in $HOME"
run = "chezmoi status"
