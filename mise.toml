[settings]
experimental = true
legacy_version_file = false

[tools]
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:bats-core/bats-core" = "1.14.0"
"aqua:twpayne/chezmoi" = "2.72.0"
"aqua:zizmorcore/zizmor" = "1.29.0"
biome = "2.5.11"
gitleaks = "8.30.1"
"pipx:ansible-lint" = "26.8.0"
"pipx:yamllint" = "1.38.0"
prek = "0.4.14"
rumdl = "0.2.62"
ruff = "0.16.5"
shellcheck = "0.11.0"
shfmt = "3.13.1"
stylua = "2.5.2"
taplo = "0.10.0"
uv = "0.12.6"

[tasks.docs]
description = "Preview the documentation at http://localhost:8000"
run = """
finalize_docs_site() {
  if [ -d docs/site ]; then
    rm -rf site
    mv docs/site site
  fi
}
trap finalize_docs_site EXIT
uv run --python 3.14 --with-requirements docs/requirements.txt zensical serve --config-file docs/mkdocs.yml
"""
raw = true

[tasks."docs:build"]
description = "Build the documentation with CI's strict settings"
run = """
uv run --python 3.14 --with-requirements docs/requirements.txt zensical build --config-file docs/mkdocs.yml --strict
rm -rf site
mv docs/site site
uv run --python 3.14 python docs/tooling/version_assets.py
"""

[tasks.reconcile]
description = "Reconcile this machine with the shared locked Ansible runtime"
run = "bootstrap/reconcile.sh"
raw = true

[tasks."reconcile:check"]
description = "Preview the Ansible reconciliation (check mode has limits)"
run = "bootstrap/reconcile.sh --check"
raw = true

[tasks."bootstrap:format"]
description = "Format bootstrap, reconciliation, and test shell code"
run = "shfmt -w bootstrap/setup.sh bootstrap/reconcile.sh tests/integration/workstation-smoke.sh tests/bootstrap/*.sh tests/bootstrap/test-helper.bash tests/bootstrap/bootstrap.bats"

[tasks."bootstrap:lint"]
description = "Lint bootstrap, reconciliation, and test shell code"
run = "shellcheck -s sh bootstrap/setup.sh bootstrap/reconcile.sh tests/bootstrap/*.sh && shellcheck -s bash tests/integration/workstation-smoke.sh tests/bootstrap/test-helper.bash"

[tasks."ansible:prepare"]
description = "Install the locked Ansible runtime and pinned collections"
run = "env ANSIBLE_COLLECTIONS_PATH=bootstrap/.ansible/collections uv run --project bootstrap --locked --managed-python ansible-galaxy collection install --collections-path bootstrap/.ansible/collections --requirements-file bootstrap/ansible/requirements.yml"

[tasks."ansible:validate-runtime"]
description = "Validate and report the locked runtime and pinned collections"
depends = ["ansible:prepare"]
run = "env ANSIBLE_COLLECTIONS_PATH=bootstrap/.ansible/collections uv run --project bootstrap --locked --managed-python python bootstrap/validate_runtime.py --collections-path bootstrap/.ansible/collections"

[tasks."test:bats"]
description = "Run black-box bootstrap behavior tests"
run = "bats tests/bootstrap"

[tasks."test:docker"]
description = "Run the Ubuntu bootstrap and Ansible integration tests in Docker"
run = "docker build --file tests/integration/Dockerfile --tag dotfiles-bootstrap-tests ."

[tasks.import]
description = "Import modified managed files from $HOME into config/"
run = "chezmoi re-add"
raw = true

[tasks.status]
description = "Show differences between config/ and the files in $HOME"
run = "chezmoi status"
