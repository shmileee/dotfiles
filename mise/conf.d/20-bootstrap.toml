[tools]
"aqua:bats-core/bats-core" = "1.14.0"

[tasks.reconcile]
description = "Reconcile this machine with the shared locked Ansible runtime"
run = "bootstrap/reconcile.sh"
raw = true

[tasks."reconcile:check"]
description = "Preview the Ansible reconciliation (check mode has limits)"
run = "bootstrap/reconcile.sh --check"
raw = true

[tasks."ansible:prepare"]
description = "Install the locked Ansible runtime and pinned collections"
run = "env ANSIBLE_COLLECTIONS_PATH=bootstrap/.ansible/collections uv run --project bootstrap --locked --managed-python ansible-galaxy collection install --collections-path bootstrap/.ansible/collections --requirements-file bootstrap/ansible/requirements.yml"

[tasks."ansible:validate-runtime"]
description = "Validate and report the locked runtime and pinned collections"
depends = ["ansible:prepare"]
run = "env ANSIBLE_COLLECTIONS_PATH=bootstrap/.ansible/collections uv run --project bootstrap --locked --managed-python python bootstrap/validate_runtime.py --collections-path bootstrap/.ansible/collections"

[tasks."ansible:syntax-check"]
description = "Check that the provisioning playbook parses against the locked runtime"
depends = ["ansible:prepare"]
env = { ANSIBLE_CONFIG = "bootstrap/ansible/ansible.cfg", ANSIBLE_COLLECTIONS_PATH = "bootstrap/.ansible/collections" }
run = "uv run --project bootstrap --locked --managed-python ansible-playbook --inventory '127.0.0.1,' --syntax-check bootstrap/ansible/main.yaml"

# Kept out of the Ansible run on purpose: ~3 GB of model blobs that an
# ephemeral CI runner would download and discard on every provisioning check.
[tasks."voice:setup"]
description = "Download the voice models and start the local transcription service"
run = "bootstrap/voice-setup.sh"
raw = true

# Every suite that runs against this checkout alone. test:docker builds a
# container image and test:provisioned reads the real $HOME, so both stay out
# and remain opt-in.
[tasks.test]
description = "Run every test suite that needs no container or provisioned machine"
depends = ["test:bats", "test:fish", "test:unit"]

[tasks."test:bats"]
description = "Run black-box bootstrap behavior tests"
run = "bats tests/bootstrap"

[tasks."test:fish"]
description = "Run black-box fish function behavior tests"
run = "bats tests/fish"

[tasks."test:unit"]
description = "Run the Python unit tests for repository tooling"
run = "env ANSIBLE_CONFIG=bootstrap/ansible/ansible.cfg ANSIBLE_COLLECTIONS_PATH=bootstrap/.ansible/collections uv run --project bootstrap --locked --managed-python python -m unittest discover --start-directory tests/unit --verbose"

[tasks."test:docker"]
description = "Run the Ubuntu bootstrap and Ansible integration tests in Docker"
run = "docker build --file tests/integration/Dockerfile --tag dotfiles-bootstrap-tests ."

# Kept out of test:bats and every other default test task on purpose: these
# assertions read the real $HOME, so they only hold on a machine this
# repository has just provisioned. Both provisioning jobs — the macOS workflow
# and the container smoke test — run this task right after their own
# provisioning run, so the suite is defined in exactly one place.
[tasks."test:provisioned"]
description = "Assert the state of a machine this repository has just provisioned"
run = "bats tests/provisioned"
