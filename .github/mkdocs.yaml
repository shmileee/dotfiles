docs_dir: ../docs
site_name: Hitchhiker's Guide to the Dotfiles
site_description: Reproducible workstation setup and the reasoning behind it.
site_url: https://dotfiles.oponomarov.com
repo_url: https://github.com/shmileee/dotfiles
edit_uri: blob/master/docs
copyright: Copyright &copy; 2021 - 2026 Oleksandr Ponomarov

nav:
  - Overview: index.md
  - What, How & Why?: what-how-and-why.md
  - Hotkeys: hotkeys.md
  - OpenCode and OMO: opencode-and-omo.md

theme:
  name: material
  custom_dir: ../docs/overrides
  palette:
    scheme: slate
  language: en
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.expand
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.instant.progress
    - navigation.tracking
    - navigation.prune
    - toc.follow
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

plugins:
  - search:
      lang: en
  - mermaid2

extra_css:
  - assets/stylesheets/design-system.css
  - assets/stylesheets/mkdocs.css

extra_javascript:
  - assets/javascripts/site-shell.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/aleksandr-ponomarov
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/shmileee/dotfiles/tags
