docs_dir: ../docs
site_name: dotfiles
site_description: Reproducible workstation setup and the reasoning behind it.
site_url: https://dotfiles.oponomarov.com
copyright: Copyright &copy; 2021 - 2026 Oleksandr Ponomarov

nav:
  - Overview: index.md
  - Setup: what-how-and-why.md
  - Shortcuts: hotkeys.md
  - OpenCode + OmO: opencode-and-omo.md

theme:
  name: material
  custom_dir: ../docs/overrides
  palette:
    scheme: slate
  language: en
  font: false
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.expand
    - content.code.copy
    - navigation.footer
    - navigation.instant.progress
    - navigation.tracking
    - navigation.prune
    - toc.follow
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      title: On this page

plugins:
  - search:
      lang: en

extra_css:
  - assets/stylesheets/design-system.css
  - assets/stylesheets/mkdocs.css

extra_javascript:
  - assets/javascripts/site-shell.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/aleksandr-ponomarov
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/shmileee/dotfiles/tags
