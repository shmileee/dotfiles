docs_dir: ../docs
site_name: dotfiles
site_description: Reproducible workstation setup and the reasoning behind it.
site_url: https://dotfiles.oponomarov.com
copyright: Copyright &copy; 2021&ndash;2026 Oleksandr Ponomarov

nav:
  - Home: index.md
  - Setup guide: setup.md
  - Shortcuts: shortcuts.md
  - OpenCode: opencode.md

theme:
  name: material
  custom_dir: ../docs/overrides
  palette:
    scheme: slate
  language: en
  font: false
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.expand
    - content.code.copy
    - navigation.footer
    - navigation.instant.progress
    - navigation.tracking
    - navigation.prune
    - toc.follow
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      title: On this page

plugins:
  - search:
      lang: en

extra_css:
  - assets/stylesheets/design-system.css
  - assets/stylesheets/mkdocs.css

extra_javascript:
  - assets/javascripts/syntax-highlight.js
  - assets/javascripts/site-shell.js

extra:
  generator: false
