---
name: Build documentation
description: Install the pinned documentation toolchain and build the site

runs:
  using: composite
  steps:
    - name: Set up mise
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      with:
        install_args: uv

    - name: Build
      shell: bash
      run: mise run docs:build
