---
name: Build documentation
description: Install the pinned documentation toolchain and build the site

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: docs/.python-version
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - name: Install dependencies
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      run: python -m pip install --requirement docs/requirements.txt

    - name: Build
      shell: bash
      run: |
        zensical build --config-file docs/mkdocs.yml --strict
        rm -rf site
        mv docs/site site
        python docs/tooling/version_assets.py
