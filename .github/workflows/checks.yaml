---
name: checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: install fish
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fish

      - name: check fish syntax and templates
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! fish --no-execute "$file"; then
              printf 'Fish syntax check failed: %s\n' "$file" >&2
              failed=1
            fi
          done < <(find config -type f -name '*.fish' -print0)

          while IFS= read -r -d '' template; do
            if ! rendered="$(mise exec -- chezmoi execute-template < "$template")"; then
              printf 'Template render failed: %s\n' "$template" >&2
              failed=1
              continue
            fi
            if ! printf '%s\n' "$rendered" | fish --no-execute; then
              printf 'Fish template syntax check failed: %s\n' "$template" >&2
              failed=1
            fi
          done < <(find config -type f -name '*.fish.tmpl' -print0)
          exit "$failed"

      - name: test fish functions
        run: mise run test:fish

      - name: restore ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bootstrap/.ansible/collections
          key: ${{ runner.os }}-ansible-${{ hashFiles('bootstrap/uv.lock', 'bootstrap/ansible/requirements.yml') }}

      - name: validate runtime and run lint
        run: |
          mise run ansible:validate-runtime
          mise run lint

      - name: check ansible syntax
        run: |
          mise exec -- env \
            ANSIBLE_CONFIG=bootstrap/ansible/ansible.cfg \
            ANSIBLE_COLLECTIONS_PATH=bootstrap/.ansible/collections \
            uv run --project bootstrap --locked --managed-python ansible-playbook \
            --inventory "127.0.0.1," \
            --syntax-check bootstrap/ansible/main.yaml

      - name: test python units
        run: mise run test:unit
