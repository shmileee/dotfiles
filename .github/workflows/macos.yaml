---
name: macos

on:
  pull_request:
    paths:
      - "config/**"
      - "bootstrap/**"
      - "tests/bootstrap/**"
      - ".chezmoiroot"
      - "mise.toml"
      - ".github/workflows/macos.yaml"
      - "!docs/**"
      - "!**/*.md"
  push:
    branches: [master]
    paths:
      - "config/**"
      - "bootstrap/**"
      - "tests/bootstrap/**"
      - ".chezmoiroot"
      - "mise.toml"
      - ".github/workflows/macos.yaml"
      - "!docs/**"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-behavior:
    name: Test POSIX bootstrap on macOS
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Install Dash
        run: brew install dash

      - name: Test the loader under Dash and macOS /bin/sh
        run: mise run test:bats

  macos:
    name: Provision through the checked-out setup and verify macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DOTFILES_PERSISTENT_EXPECTED_COMMIT: ${{ github.sha }}
      DOTFILES_PERSISTENT_REF: ${{ github.sha }}
      DOTFILES_PERSISTENT_REFSPEC: +${{ github.ref }}:refs/remotes/origin/ci
      GITHUB_TOKEN: ${{ github.token }}
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Reset Homebrew formulae
        run: |
          # The runner image can contain mise environments backed by Homebrew
          # interpreters removed below. Discard only those ephemeral installs
          # so bootstrap must create one coherent toolchain from scratch.
          rm -rf "$HOME/.local/share/mise/installs" "$HOME/.local/share/mise/shims"

          formulae="$(brew list --formula)"
          if [[ -n "$formulae" ]]; then
            # Formula names cannot contain whitespace; uninstalling them in one
            # transaction avoids starting Homebrew once per preinstalled tool.
            # shellcheck disable=SC2086
            brew uninstall --formula --ignore-dependencies --force $formulae
          fi

          # Keep runner-provided GUI applications and their cask metadata;
          # Ansible installs any configured applications that are missing.
          brew cleanup --prune-prefix

      - name: Install through the checked-out POSIX setup
        run: ./bootstrap/setup.sh

      - name: Validate
        run: |
          cd "$HOME/ghq/personalgit/$GITHUB_REPOSITORY"
          mise install
          mise run lint

      - name: Verify a second run is idempotent
        run: |
          cd "$HOME/ghq/personalgit/$GITHUB_REPOSITORY"
          mise run reconcile | tee /tmp/ansible-idempotence.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' /tmp/ansible-idempotence.log
