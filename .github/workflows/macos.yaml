---
name: macos

on:
  pull_request:
    paths:
      - "config/**"
      - "bootstrap/**"
      - "tests/bootstrap/**"
      - ".chezmoiroot"
      - "mise.toml"
      - "mise/conf.d/20-bootstrap.toml"
      - ".github/workflows/macos.yaml"
      - "!docs/**"
      - "!**/*.md"
  push:
    branches: [master]
    paths:
      - "config/**"
      - "bootstrap/**"
      - "tests/bootstrap/**"
      - ".chezmoiroot"
      - "mise.toml"
      - "mise/conf.d/20-bootstrap.toml"
      - ".github/workflows/macos.yaml"
      - "!docs/**"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: test bootstrap
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: aqua:bats-core/bats-core

      - name: install dash
        run: brew install dash

      - name: test with dash and /bin/sh
        run: mise run test:bats

  provision:
    name: verify provisioning
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DOTFILES_PERSISTENT_EXPECTED_COMMIT: ${{ github.sha }}
      DOTFILES_PERSISTENT_REF: ${{ github.sha }}
      DOTFILES_PERSISTENT_REFSPEC: +${{ github.ref }}:refs/remotes/origin/ci
      GITHUB_TOKEN: ${{ github.token }}
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: reset homebrew formulae
        run: |
          # The runner image can contain mise environments backed by Homebrew
          # interpreters removed below. Discard only those ephemeral installs
          # so bootstrap must create one coherent toolchain from scratch.
          rm -rf "$HOME/.local/share/mise/installs" "$HOME/.local/share/mise/shims"

          formulae="$(brew list --formula)"
          if [[ -n "$formulae" ]]; then
            # Formula names cannot contain whitespace; uninstalling them in one
            # transaction avoids starting Homebrew once per preinstalled tool.
            # shellcheck disable=SC2086
            brew uninstall --formula --ignore-dependencies --force $formulae
          fi

          # Keep runner-provided GUI applications and their cask metadata;
          # Ansible installs any configured applications that are missing.
          brew cleanup --prune-prefix

      - name: install through local setup
        run: ./bootstrap/setup.sh

      - name: install tools and run lint
        run: |
          cd "$HOME/ghq/personalgit/$GITHUB_REPOSITORY"
          mise install
          mise run lint

      - name: verify managed runtime dependencies
        run: |
          test "$(command -v bash)" = /opt/homebrew/bin/bash
          bash -c '(( BASH_VERSINFO[0] >= 4 ))'
          command -v git-lfs
          command -v session-manager-plugin
          test "$(git config --file "$HOME/.config/git/personal" --get commit.gpgsign)" = true
          test "$(git config --file "$HOME/.config/git/personal" --get gpg.ssh.program)" = /Applications/1Password.app/Contents/MacOS/op-ssh-sign

      - name: verify idempotency
        run: |
          cd "$HOME/ghq/personalgit/$GITHUB_REPOSITORY"
          mise run reconcile | tee /tmp/ansible-idempotence.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' /tmp/ansible-idempotence.log
