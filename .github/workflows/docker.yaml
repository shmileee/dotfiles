---
name: docker

on:
  pull_request:
    paths:
      - "config/**"
      - "bootstrap/**"
      - "tests/bootstrap/**"
      - "tests/integration/**"
      - ".dockerignore"
      - "Dockerfile"
      - "mise.toml"
      - "mise/conf.d/20-bootstrap.toml"
      - ".github/workflows/docker.yaml"
      - "!docs/**"
      - "!**/*.md"
  push:
    branches: [master]
    paths:
      - "config/**"
      - "bootstrap/**"
      - "tests/bootstrap/**"
      - "tests/integration/**"
      - ".dockerignore"
      - "Dockerfile"
      - "mise.toml"
      - "mise/conf.d/20-bootstrap.toml"
      - ".github/workflows/docker.yaml"
      - "!docs/**"
      - "!**/*.md"

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: ${{ github.repository }}
  DOCKERHUB_USERNAME: ${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing two tags is not atomic, so do not cancel a release midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap-behavior:
    name: Test bootstrap behavior on the runner
    runs-on: ${{ vars.UBUNTU_ARM_RUNNER }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify the public bootstrap redirect
        run: |
          repository_slug="$(./bootstrap/setup.sh --print-config | sed -n 's/^repository_slug=//p')"
          repository_ref="$(./bootstrap/setup.sh --print-config | sed -n 's/^repository_ref=//p')"
          bootstrap_url="$(./bootstrap/setup.sh --print-config | sed -n 's/^bootstrap_url=//p')"
          target="$(curl -fsSIL -o /dev/null --write-out '%{url_effective}' "$bootstrap_url")"
          test "$target" = "https://raw.githubusercontent.com/$repository_slug/$repository_ref/bootstrap/setup.sh"

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run Bats behavior tests
        run: mise run test:bats

  docker-integration:
    name: Test Ansible bootstrap integration in Docker
    runs-on: ${{ vars.UBUNTU_ARM_RUNNER }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build the integration image
        run: docker build --file tests/integration/Dockerfile --tag dotfiles-bootstrap-tests .

  build-test-publish:
    name: Build, test, and publish image
    runs-on: ${{ vars.UBUNTU_ARM_RUNNER }}
    timeout-minutes: 45
    env:
      DOTFILES_PERSISTENT_EXPECTED_COMMIT: ${{ github.sha }}
      DOTFILES_PERSISTENT_REF: ${{ github.sha }}
      DOTFILES_PERSISTENT_REFSPEC: +${{ github.ref }}:refs/remotes/origin/ci

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build test image
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          load: true
          platforms: linux/arm64
          push: false
          tags: dotfiles:test
          build-args: |
            DOTFILES_PERSISTENT_EXPECTED_COMMIT=${{ env.DOTFILES_PERSISTENT_EXPECTED_COMMIT }}
            DOTFILES_PERSISTENT_REF=${{ env.DOTFILES_PERSISTENT_REF }}
            DOTFILES_PERSISTENT_REFSPEC=${{ env.DOTFILES_PERSISTENT_REFSPEC }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          secrets: |
            GITHUB_TOKEN=${{ github.token }}

      - name: Smoke-test image and second provisioning pass
        run: tests/integration/workstation-smoke.sh dotfiles:test

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'push'
        env:
          SHA_TAG: ${{ github.sha }}
        run: |
          docker tag dotfiles:test "$DOCKERHUB_IMAGE:$SHA_TAG"
          docker tag dotfiles:test "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:$SHA_TAG"
          docker push "$DOCKERHUB_IMAGE:latest"
