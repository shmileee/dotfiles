---
name: docker

on:
  pull_request:
    paths:
      - "config/**"
      - "scripts/**"
      - ".dockerignore"
      - "Dockerfile"
      - "mise.toml"
      - ".github/workflows/docker.yaml"
      - "!docs/**"
      - "!**/*.md"
  push:
    branches: [master]
    paths:
      - "config/**"
      - "scripts/**"
      - ".dockerignore"
      - "Dockerfile"
      - "mise.toml"
      - ".github/workflows/docker.yaml"
      - "!docs/**"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing two tags is not atomic, so do not cancel a release midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-publish:
    name: Build, test, and publish image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build test image
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          load: true
          platforms: linux/arm64
          push: false
          tags: dotfiles:test
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          secrets: |
            GITHUB_TOKEN=${{ github.token }}

      - name: Smoke-test image and second provisioning pass
        run: scripts/docker/smoke.sh dotfiles:test

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: shmileee
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'push'
        env:
          IMAGE: shmileee/dotfiles
          SHA_TAG: ${{ github.sha }}
        run: |
          docker tag dotfiles:test "$IMAGE:$SHA_TAG"
          docker tag dotfiles:test "$IMAGE:latest"
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"
