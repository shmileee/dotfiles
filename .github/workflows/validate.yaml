---
name: validate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Install Fish
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fish

      - name: Validate Fish syntax and templates
        run: |
          find config -type f -name '*.fish' -exec fish --no-execute {} +

          while IFS= read -r -d '' template; do
            mise exec -- chezmoi execute-template < "$template" | fish --no-execute
          done < <(find config -type f -name '*.fish.tmpl' -print0)

      - name: Restore Ansible collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bootstrap/.ansible/collections
          key: ${{ runner.os }}-ansible-${{ hashFiles('bootstrap/uv.lock', 'scripts/common/ansible/requirements.yml') }}

      - name: Run repository checks
        run: |
          mise run ansible:prepare
          mise exec -- prek run --all-files

      - name: Validate Ansible syntax
        run: |
          mise exec -- env \
            ANSIBLE_CONFIG=scripts/common/ansible/ansible.cfg \
            ANSIBLE_COLLECTIONS_PATH=bootstrap/.ansible/collections \
            uv run --project bootstrap --locked --managed-python ansible-playbook \
            --inventory "127.0.0.1," \
            --syntax-check scripts/common/ansible/main.yaml

      - name: Test local Ansible module helpers
        run: python3 -m unittest discover -s tests/unit -v
