---
name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs-overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/version_docs_assets.py"
      - ".github/actions/build-docs/action.yaml"
      - ".github/workflows/docs.yaml"
  push:
    branches:
      - "master"
    paths:
      - "docs/**"
      - "docs-overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/version_docs_assets.py"
      - ".github/actions/build-docs/action.yaml"
      - ".github/workflows/docs.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production deployment midway through publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build documentation
        uses: ./.github/actions/build-docs

  deploy:
    name: Build and deploy documentation
    if: github.event_name == 'push'
    permissions:
      contents: write # Push the generated site to the gh-pages branch.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build documentation
        uses: ./.github/actions/build-docs

      - name: Deploy
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: dotfiles.oponomarov.com
