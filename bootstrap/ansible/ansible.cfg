[defaults]
library = ./library
module_utils = ./module_utils
retry_files_enabled = false
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
stdout_callback = ansible.builtin.default
callback_result_format = yaml
show_task_path_on_failure = true
# Report only what a run actually changed. The default callback prints a task
# banner eagerly only while both display_ok_hosts and display_skipped_hosts are
# enabled, so disabling them makes banners lazy and idempotent tasks disappear
# instead of burying the few interesting ones. Result payloads are separately
# gated behind verbosity > 0; most tasks here are ansible.builtin.command, and
# verbosity 1 is what surfaces their stdout (such as the file list from
# `chezmoi apply --verbose`). Module arguments stay hidden because the callback
# strips invocation below -vvv, keeping the sudo password out of the output.
verbosity = 1
display_ok_hosts = false
display_skipped_hosts = false

[callback_profile_tasks]
task_output_limit = 50
sort_order = descending
# Lazy task banners leave this callback's per-task timestamps orphaned, so keep
# only its closing timing table. Upstream documents this as the companion to
# display_ok_hosts = false.
summary_only = true
