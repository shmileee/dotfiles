---

- name: "install tools"
  ansible.builtin.command: mise install
  args:
    chdir: "{{ ansible_facts['user_dir'] }}"
  environment:
    GITHUB_TOKEN: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"
    MISE_HTTP_TIMEOUT: 120s
    # mise's embedded npm backend (aube) hard-refuses low-download packages in
    # non-interactive contexts (ERR_AUBE_LOW_DOWNLOAD_PACKAGE); allowlist the
    # vetted ones pinned in ~/.config/mise/config.toml or bootstrap fails.
    NPM_CONFIG_ALLOWED_UNPOPULAR_PACKAGES: mcp-server-linear
  register: mise_install
  changed_when: "'all tools are installed' not in (mise_install.stdout + mise_install.stderr)"

- name: "mise | trust the persistent repository configuration"
  ansible.builtin.command:
    argv:
      - mise
      - trust
      - --yes
      - mise.toml
  args:
    chdir: "{{ persistent_checkout }}"
  changed_when: false

- name: "mise | resolve the repository-pinned uv runtime state"
  ansible.builtin.command:
    argv:
      - mise
      - ls
      - uv
      - --current
      - --json
  args:
    chdir: "{{ persistent_checkout }}"
  register: mise_uv_state
  changed_when: false

# `mise install uv` prints "already installed" when there is nothing to do, so
# matching "installed" in its output marked every converged run as changed. Gate
# on the resolved state instead: --current honours the checkout's pin and reports
# installed as a boolean, independent of mise's output wording.
- name: "mise | install the repository-pinned uv runtime"
  ansible.builtin.command:
    argv:
      - mise
      - install
      - uv
  args:
    chdir: "{{ persistent_checkout }}"
  environment:
    GITHUB_TOKEN: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"
    MISE_HTTP_TIMEOUT: 120s
  when: "mise_uv_state.stdout | from_json | selectattr('installed') | list | length == 0"
  changed_when: true
