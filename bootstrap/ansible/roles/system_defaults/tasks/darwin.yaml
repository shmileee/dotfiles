---

- name: "create screenshot directory"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Pictures/Screenshots"
    state: directory
    mode: "0755"

- name: "apply global defaults"
  block:
    - name: "apply global default"
      ansible.builtin.include_tasks: set_osx_defaults.yaml
      loop: "{{ osx_global_defaults }}"
  tags:
    - defaults
    - global

- name: "apply Rectangle defaults"
  block:
    - name: "apply Rectangle default"
      ansible.builtin.include_tasks: set_osx_defaults.yaml
      loop: "{{ osx_rectangle_defaults }}"
  tags:
    - defaults
    - rectangle

- name: "apply AltTab defaults"
  block:
    - name: "apply AltTab default"
      macos_defaults_plist:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        value_type: "{{ item.type }}"
        value: "{{ item.value }}"
        dict_mode: "{{ item.dict_mode | default('replace') }}"
      loop: "{{ osx_alt_tab_defaults }}"
      loop_control:
        label: "{{ item.name }}"
  tags:
    - defaults
    - alt-tab

- name: "configure Dock"
  ansible.builtin.import_tasks: dock.yaml
  tags: dock

- name: "configure keybindings"
  ansible.builtin.import_tasks: keybindings.yaml
  tags: keybindings
