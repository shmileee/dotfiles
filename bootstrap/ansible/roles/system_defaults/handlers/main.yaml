---

- name: "apply keyboard modifier mapping"
  ansible.builtin.command:
    argv:
      - /usr/bin/hidutil
      - property
      - --set
      - "{{ {'UserKeyMapping': keyboard_modifier_mapping} | to_json }}"

- name: "restart preference services"
  ansible.builtin.command:
    argv:
      - /usr/bin/killall
      - cfprefsd
  register: restart_preference_services
  failed_when: restart_preference_services.rc not in [0, 1]
