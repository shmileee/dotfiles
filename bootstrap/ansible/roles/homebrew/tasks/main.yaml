---

- name: "homebrew | inspect the installation"
  ansible.builtin.stat:
    path: "{{ homebrew_executable }}"
  register: homebrew_binary

- name: "homebrew | install on macos"
  ansible.builtin.include_tasks: darwin.yaml
  when:
    - not homebrew_binary.stat.exists
    - not ansible_check_mode
    - ansible_facts['system'] == 'Darwin'

- name: "homebrew | install on linux"
  ansible.builtin.include_tasks: linux.yaml
  when:
    - not homebrew_binary.stat.exists
    - not ansible_check_mode
    - ansible_facts['system'] == 'Linux'

- name: "homebrew | verify the installation"
  ansible.builtin.command:
    argv:
      - "{{ homebrew_executable }}"
      - --version
  changed_when: false
  when: not ansible_check_mode

- name: "homebrew | disable analytics"
  ansible.builtin.command:
    argv:
      - "{{ homebrew_executable }}"
      - analytics
      - "off"
  changed_when: false
  when: not ansible_check_mode
