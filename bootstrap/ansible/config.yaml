bootstrap_linux_packages:
  - bash
  - build-essential
  - ca-certificates
  - curl
  - file
  - git
  - gpg
  - libssl-dev
  - less
  - locales
  - llvm
  - make
  - procps
  - python3-pip
  - python-is-python3
  - unzip
  - vim
  - wget
  - xclip

brew:
  taps:
    - anomalyco/tap
    - carlocab/personal
    - controlplaneio-fluxcd/tap
    - fluxcd/tap
    - raine/workmux
    - shmileee/tap
  casks:
    - 1password
    - 1password-cli
    - shmileee/tap/alacritty
    - alt-tab
    - aws-vault
    - chatgpt
    - google-chrome
    - hiddenbar
    - kdiff3
    - microsoft-outlook
    - rectangle
    - session-manager-plugin
    - slack
    - spotify
    - telegram
  packages:
    common:
      - bat
      - coreutils
      # k9s crossplane.yaml plugin
      - crossplane
      - direnv
      - duf
      - dust
      - eza
      - fd
      # k9s flux.yaml plugin. Fully qualified: homebrew/core/flux is
      # InfluxData's query language, an unrelated project of the same name.
      - fluxcd/tap/flux
      # k9s flux.yaml plugin, for its FluxInstance and ResourceSet entries
      - controlplaneio-fluxcd/tap/flux-operator
      - fzf
      - gh
      - ghq
      - git
      - git-delta
      - jaq
      - lazygit
      - mise
      # fully qualified: shadows homebrew/core/opencode
      - anomalyco/tap/opencode
      - raine/workmux/workmux
      - yq
      - ripgrep
      - sponge
      - tmux
      # nvim-treesitter's main branch shells out to `tree-sitter generate`
      # and `tree-sitter build`; without the CLI every parser install fails.
      # not `tree-sitter`, which is the parsing library and ships no binary.
      - tree-sitter-cli
      - zoxide
    darwin:
      - bash
      - carlocab/personal/unrar
      - dockutil
      - switchaudio-osx
      - ffmpeg
      - sox
      - whisper-cpp
      - ollama
      - gawk
      - gnu-sed
      - wget
      - xz
    linux: []

dotfiles:
  checkout: "{{ persistent_checkout }}"

dockitems:
  - name: Google Chrome
    path: "/Applications/Google Chrome.app"
  - name: Alacritty
    path: "/Applications/Alacritty.app"
  - name: Slack
    path: "/Applications/Slack.app"
  - name: ChatGPT
    path: "/Applications/ChatGPT.app"
  - name: Telegram
    path: "/Applications/Telegram.app"
  - name: Spotify
    path: "/Applications/Spotify.app"
  - name: Microsoft Outlook
    path: "/Applications/Microsoft Outlook.app"
  - name: Calendar
    path: "/System/Applications/Calendar.app"
  - name: System Settings
    path: "/System/Applications/System Settings.app"
  - name: Downloads
    path: "{{ ansible_facts['user_dir'] }}/Downloads"
    section: others
    view: auto
    display: stack
    sort: dateadded

keyboard_key_codes:
  caps_lock: 30064771129
  escape: 30064771113

darwin_hotkeys:
  # remap "show spotlight search` to `⌘ + g`
  "64":
    enabled: true
    value:
      parameters: [103, 5, 1048576]
      type: standard
  # disable "select the previous source in input menu"
  "60":
    enabled: false
    value:
      parameters: [32, 49, 262144]
      type: standard
  # remap "select the next source in input menu" to `⌘ + space`
  "61":
    enabled: true
    value:
      parameters: [32, 49, 1048576]
      type: standard

tmux_plugins:
  - repo: https://github.com/tmux-plugins/tpm
    name: tpm
    version: 7bdb7ca33c9cc6440a600202b50142f401b6fe21
    update: true
  - repo: https://github.com/shmileee/opencode-contextual-notifier
    name: opencode-contextual-notifier
    version: eebf6c146a14d860ece6242564ba8cddb4819a10
    update: true
