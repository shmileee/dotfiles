---
# Hook scheduling.
#
# prek runs hooks sequentially unless they share an explicit `priority`; hooks
# with equal priority run concurrently. Three properties of that model matter
# here, all verified against prek 0.5.2 on this repository:
#
#   1. Hooks with the same explicit priority run at the same time.
#   2. Hooks that omit `priority` stay strictly sequential.
#   3. A priority group never overlaps hooks outside it, and the unprioritised
#      hooks run first.
#
# So the split below is by write behaviour, not by speed:
#
#   no priority         Hooks that rewrite files. They stay sequential because
#                       end-of-file-fixer, trailing-whitespace and
#                       mixed-line-ending rewrite *every* file, so overlapping
#                       them with a language formatter would drop edits.
#   priority: readonly  Hooks that only read. Concurrency is safe, and by (3)
#                       they still observe the formatters' output.
#
# `prek run --all-files` went from 7.8s to 3.0s; ansible-lint and zizmor alone
# were 5.1s of serial wall time.
#
# Adding a hook: leave `priority` unset unless you are sure the hook never
# writes to the working tree. Omitting it is always safe, only slower. Use
# `PREK_NO_CONCURRENCY=1` to force everything sequential when debugging.
priorities:
  readonly: 100

# Shim lifecycle.
#
# `prek install` bakes the absolute path of the prek binary that generated it
# into .git/hooks/*. mise keeps old installs on disk, so that path stays
# executable and the shim's own PATH fallback never triggers: once the pinned
# version moves, every commit keeps running the previous prek indefinitely.
#
# The prek-shim-refresh hook below closes that by regenerating the shims
# through mise after the operations that can change the pin: `git pull` lands
# a Renovate bump via post-merge, and a rebase lands it via post-rewrite.
# Nothing here names a version, so the bump takes effect on its own.
#
# post-checkout is deliberately NOT installed. Git makes that hook's exit
# status the exit status of `git checkout`/`git switch`, and prek refuses to
# run a ref-diff stage while .pre-commit-config.yaml itself has uncommitted
# changes -- so editing this file would make every branch switch fail. Neither
# post-merge nor post-rewrite can affect its command's outcome.
#
# For a fresh clone, or after editing the pin by hand, run `mise run
# prek:install`.
#
# default_stages keeps every other hook on pre-commit only, so installing the
# post-* shims does not drag the whole suite into a merge.
default_stages: [pre-commit]
default_install_hook_types:
  - pre-commit
  - post-merge
  - post-rewrite

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        name: check added large files
        # 3 MiB, to allow demo/dotfiles.gif (~2.3 MiB). Text in a terminal
        # recording only compresses so far before the glyphs go soft, and the
        # GIF is a deliberate, regenerable asset rather than a stray binary.
        args: ["--maxkb=3072"]
        priority: readonly
      - id: check-case-conflict
        name: check case conflicts
        priority: readonly
      - id: check-merge-conflict
        name: check merge conflicts
        priority: readonly
      - id: check-symlinks
        name: check symlinks
        priority: readonly
      - id: end-of-file-fixer
        name: fix end of files
      - id: trailing-whitespace
        name: trim trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-executables-have-shebangs
        name: check executable shebangs
        priority: readonly
      - id: mixed-line-ending
        name: fix mixed line endings
      - id: detect-private-key
        name: detect private keys
        priority: readonly
      - id: destroyed-symlinks
        name: detect destroyed symlinks
        priority: readonly
      - id: check-vcs-permalinks
        name: check vcs permalinks
        priority: readonly
      - id: check-shebang-scripts-are-executable
        name: check shebang scripts are executable
        # Only outside the chezmoi source root. Inside config/ the deployed
        # mode comes from the `executable_` filename prefix, so the source
        # file's own bit carries no meaning and every script would be
        # reported.
        files: \.sh$
        exclude: ^config/
        priority: readonly
      - id: deny-pattern
        name: deny absolute home paths in managed config
        # A managed file must derive the home directory from a template
        # variable; a literal /Users/<name>/ path only works on one machine.
        args: ["/Users/[a-z][a-z0-9._-]*/"]
        files: ^config/
        types: [text]
        priority: readonly

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.97.4
    hooks:
      - id: renovate-config-validator
        name: validate renovate configuration
        args: [--strict]
        priority: readonly

  - repo: local
    hooks:
      - id: prek-shim-refresh
        name: refresh prek git shims
        # Regenerates .git/hooks/* with whatever prek mise currently resolves,
        # so a version bump needs no manual `prek install`. Runs only on the
        # post-* stages, so it costs a commit nothing. See the note above.
        entry: mise exec -- prek install --force
        language: system
        stages: [post-merge, post-rewrite]
        always_run: true
        pass_filenames: false
      - id: gitleaks
        name: scan secrets with gitleaks
        entry: gitleaks dir --config .github/.gitleaks.toml --redact
          --no-banner .
        language: system
        pass_filenames: false
        priority: readonly
      - id: biome
        name: lint and format web files with biome
        entry: biome check --write --no-errors-on-unmatched
        language: system
        files: \.(css|jsonc?|m?[jt]sx?|c[jt]s)$
      - id: ruff-check
        name: lint python with ruff
        entry: ruff check
        language: system
        types: [python]
        priority: readonly
      - id: ruff-format
        name: format python with ruff
        entry: ruff format
        language: system
        types: [python]
      - id: stylua
        name: format lua with stylua
        entry: stylua
        language: system
        types: [lua]
      - id: taplo
        name: format toml with taplo
        entry: taplo format
        language: system
        types: [toml]
      - id: rumdl
        name: format markdown with rumdl
        entry: rumdl fmt --config .github/.rumdl.toml
        language: system
        types: [markdown]
      - id: chezmoi-templates
        name: validate chezmoi templates
        entry: chezmoi execute-template --source . --file
        language: system
        files: \.tmpl$
        priority: readonly
      - id: shfmt
        name: format shell with shfmt
        entry: shfmt --write
        language: system
        files: (\.(sh|bash)$|^config/bin/executable_[a-z0-9-]+$)
        exclude: ^config/bin/executable_rg-sed$
      - id: fish-indent
        name: format fish with fish_indent
        entry: fish_indent --write
        language: system
        files: \.fish$
      - id: fish-syntax
        name: check fish syntax
        # fish --no-execute only parses its FIRST argument and passes the
        # rest through as $argv, so a batched invocation would silently skip
        # every file after the first. One file per invocation is required.
        entry: fish --no-execute
        language: system
        files: \.fish$
        pass_filenames: 1
        priority: readonly
      - id: fish-syntax-templates
        name: check fish template syntax
        # Same reasoning as shellcheck-templates: render the Go template
        # first, then parse the generated script.
        shell: sh
        entry: |-
          if ! rendered=$(chezmoi execute-template --source . --file "$1"); then
            printf 'cannot render %s\n' "$1" >&2
            exit 1
          fi
          if ! printf '%s\n' "$rendered" | fish --no-execute; then
            printf '^ in %s\n' "$1" >&2
            exit 1
          fi
        language: system
        files: \.fish\.tmpl$
        pass_filenames: 1
        priority: readonly
      - id: shellcheck
        name: lint shell with shellcheck
        entry: shellcheck
        language: system
        files: (\.(sh|bash)$|^config/bin/executable_[a-z0-9-]+$)
        exclude: ^config/bin/executable_rg-sed$
        priority: readonly
      - id: shellcheck-templates
        name: lint shell templates with shellcheck
        # Go template syntax is not valid shell, so the raw .tmpl cannot be
        # linted directly; render it first and lint the generated script.
        # `shell` runs the body directly, and one file per invocation keeps
        # the body free of a loop.
        shell: sh
        entry: |-
          if ! rendered=$(chezmoi execute-template --source . --file "$1"); then
            printf 'cannot render %s\n' "$1" >&2
            exit 1
          fi
          if ! printf '%s\n' "$rendered" | shellcheck --shell=sh -; then
            printf '^ in %s\n' "$1" >&2
            exit 1
          fi
        language: system
        files: ^config/bin/.*\.tmpl$
        pass_filenames: 1
        priority: readonly
      - id: shellcheck-bats
        name: lint bats tests with shellcheck
        # bats assigns its helper variables inside setup(), which shellcheck
        # analyses separately, so SC2154 fires on every one of them.
        entry: shellcheck --exclude=SC2154
        language: system
        files: \.bats$
        priority: readonly
      - id: yamllint
        name: lint yaml with yamllint
        entry: yamllint --config-file .github/.yamllint.yaml
        language: system
        types: [yaml]
        priority: readonly
      - id: actionlint
        name: lint github actions with actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
        priority: readonly
      - id: zizmor
        name: audit github actions with zizmor
        entry: zizmor --min-severity medium --min-confidence medium
        language: system
        files: ^\.github/(actions|workflows)/.*\.ya?ml$
        types: [yaml]
        priority: readonly
      - id: ansible-lint
        name: lint ansible with ansible-lint
        entry: ansible-lint --config-file .github/.ansible-lint
          --project-dir . --yamllint-file .github/.yamllint.yaml
          bootstrap/ansible
        language: system
        env:
          ANSIBLE_CONFIG: bootstrap/ansible/ansible.cfg
          ANSIBLE_COLLECTIONS_PATH: bootstrap/.ansible/collections
        pass_filenames: false
        files: ^bootstrap/ansible/
        priority: readonly
