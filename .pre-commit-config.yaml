---
repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        name: check added large files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
        name: check case conflicts
      - id: check-merge-conflict
        name: check merge conflicts
      - id: check-symlinks
        name: check symlinks
      - id: end-of-file-fixer
        name: fix end of files
      - id: trailing-whitespace
        name: trim trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-executables-have-shebangs
        name: check executable shebangs
      - id: mixed-line-ending
        name: fix mixed line endings
      - id: detect-private-key
        name: detect private keys

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.50.3
    hooks:
      - id: renovate-config-validator
        name: validate renovate configuration
        args: [--strict]

  - repo: local
    hooks:
      - id: gitleaks
        name: scan secrets with gitleaks
        entry: gitleaks dir --config .github/.gitleaks.toml --redact
          --no-banner .
        language: system
        pass_filenames: false
      - id: biome
        name: lint and format web files with biome
        entry: biome check --config-path .github/biome.json --vcs-root .
          --write --no-errors-on-unmatched
        language: system
        files: \.(css|js|json|jsonc)$
      - id: ruff-check
        name: lint python with ruff
        entry: ruff check --config .github/ruff.toml
        language: system
        types: [python]
      - id: ruff-format
        name: format python with ruff
        entry: ruff format --config .github/ruff.toml
        language: system
        types: [python]
      - id: stylua
        name: format lua with stylua
        entry: stylua
        language: system
        types: [lua]
      - id: taplo
        name: format toml with taplo
        entry: taplo format
        language: system
        types: [toml]
      - id: rumdl
        name: format markdown with rumdl
        entry: rumdl fmt --config .github/.rumdl.toml
        language: system
        types: [markdown]
      - id: chezmoi-templates
        name: validate chezmoi templates
        entry: chezmoi execute-template --file
        language: system
        files: \.tmpl$
      - id: shfmt
        name: format shell with shfmt
        entry: shfmt --write
        language: system
        types: [shell]
      - id: fish-indent
        name: format fish with fish_indent
        entry: fish_indent --write
        language: system
        files: \.fish$
      - id: shellcheck
        name: lint shell with shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: yamllint
        name: lint yaml with yamllint
        entry: yamllint --config-file .github/.yamllint.yaml
        language: system
        types: [yaml]
      - id: actionlint
        name: lint github actions with actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
      - id: zizmor
        name: audit github actions with zizmor
        entry: zizmor --min-severity medium --min-confidence medium
        language: system
        files: ^\.github/(actions|workflows)/.*\.ya?ml$
        types: [yaml]
      - id: ansible-lint
        name: lint ansible with ansible-lint
        entry: env ANSIBLE_CONFIG=bootstrap/ansible/ansible.cfg
          ANSIBLE_COLLECTIONS_PATH=bootstrap/.ansible/collections ansible-lint
          --config-file .github/.ansible-lint --project-dir .
          --yamllint-file .github/.yamllint.yaml bootstrap/ansible
        language: system
        pass_filenames: false
        files: ^bootstrap/ansible/
