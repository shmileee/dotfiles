<header class="site-header" data-site-header data-md-component="header">
  <div class="reading-progress" aria-hidden="true"><span data-reading-progress></span></div>
  <div class="header-inner">
    <a class="brand-link" href="https://portfolio.oponomarov.com/" aria-label="Oleksandr Ponomarov portfolio">
      <span class="brand-full">~/oleksandr-ponomarov</span>
      <span class="brand-short" aria-hidden="true">~/op</span>
    </a>
    <a class="docs-home" href="{{ nav.homepage.url | url }}">dotfiles</a>

    <nav class="site-nav" aria-label="Primary navigation">
      {% for nav_item in nav %}
        {% if loop.index <= 3 %}
          <a href="{{ nav_item.url | url }}">{{ nav_item.title }}</a>
        {% endif %}
      {% endfor %}
      <a href="https://portfolio.oponomarov.com/">Portfolio</a>
      <a href="https://github.com/shmileee/dotfiles">GitHub</a>
    </nav>

    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-label="Switch to light color scheme" data-theme-toggle>light</button>
      <label class="header-icon md-icon" for="__search" aria-label="Search documentation">
        {% include ".icons/material/magnify.svg" %}
      </label>
      <label class="header-icon header-menu md-icon" for="__drawer" aria-label="Open navigation">
        {% include ".icons/material/menu.svg" %}
      </label>
    </div>
  </div>
  {% include "partials/search.html" %}
</header>
