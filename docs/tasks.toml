[docs]
description = "Preview the documentation at http://localhost:8000"
run = "uv run --directory docs --with-requirements requirements.txt zensical serve --config-file mkdocs.yml"
raw = true

["docs:build"]
description = "Build the documentation with CI's strict settings"
run = """
uv run --directory docs --with-requirements requirements.txt zensical build --config-file mkdocs.yml --strict
uv run --directory docs python tooling/version_assets.py site
"""
