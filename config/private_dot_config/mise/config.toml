[settings]
legacy_version_file = false
# Per-tree gh account pins (GH_TOKEN) are chezmoi-managed; trusting them here
# keeps `mise trust` out of the bootstrap.
trusted_config_paths = [
  "~/ghq/personalgit/mise.toml",
  "~/ghq/workgit/mise.toml",
]

[tools]
"aqua:helm" = "4.3.1"
"aqua:kubectl" = "1.37.1"
"aqua:aws/aws-cli" = "2"
"aqua:derailed/k9s" = "0.51.0"
"aqua:kubernetes-sigs/aws-iam-authenticator" = "0.7"
"aqua:hadolint/hadolint" = "2"
"aqua:kubernetes-sigs/kustomize" = "5"
"aqua:neovim/neovim" = "0.12.6"
"aqua:terraform" = "1.17.0"
"aqua:hashicorp/terraform-ls" = "0.39.0"
"aqua:terraform-docs/terraform-docs" = "0"
"aqua:terraform-linters/tflint" = "0"
"aqua:terramate" = "0.17.3"
"go:golang.org/x/tools/gopls" = "0.24.0"
"npm:mcp-server-linear" = "1.6.0"
"pipx:azure-cli" = "2.91.0"
"pipx:yamllint" = "1.38.0"
bun = "1.4.4"
go = "1.27.3"
golangci-lint = "2.15.0"
node = "24.22.1"
prek = "0.5.2"
python = "3.15.1"
ruby = "4.0.9"
shellcheck = "0.11.0"
shfmt = "3.13.1"
uv = "0.12.6"
vault = "2.2.1"
