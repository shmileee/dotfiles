# ==========================
# ===  General settings  ===
# ==========================

set -g default-terminal "tmux-256color"
# Reset to defaults first so config reloads don't accumulate duplicate entries
# (set -as appends on every source-file).
set -su terminal-features
set -as terminal-features ",xterm*:RGB"
# alacritty: truecolor, undercurl + colored underlines (usstyle), OSC8
# hyperlinks, OSC52 clipboard writes (required for native copy-mode ->
# system clipboard now that tmux-yank is gone), extended keys (CSI-u), and
# cursor style passthrough (DECSCUSR, so fish's blinking cursor reaches the
# terminal).
set -as terminal-features ",alacritty*:RGB:usstyle:hyperlinks:clipboard:extkeys:cstyle"
# Forward extended key sequences (e.g. Shift+Enter as CSI-u) to programs in
# panes, even ones that don't request them, so opencode can tell Shift+Enter
# apart from Enter. Requires the matching Alacritty Shift+Enter binding.
set -s extended-keys always
# Allow programs inside tmux (nvim OSC52 provider, remote shells) to set the
# system clipboard through tmux, not just tmux's own copy-mode.
set -s set-clipboard on
# Blinking block cursor for panes that haven't set their own style (fish's
# default bindings never emit DECSCUSR). Without this, tmux's cursor reset
# (Se) is hardcoded to steady block (\e[2 q), overriding Alacritty's blinking
# default. Apps like nvim still override per-pane via DECSCUSR.
set -g cursor-style blinking-block
set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
# Don't detach remaining clients when a session is destroyed (moved here from
# the Alacritty shell args); switch to the most recently active session instead.
set -g detach-on-destroy off
setw -g allow-rename off
setw -g automatic-rename off

# Change prefix key to C-a, easier to type, same to "screen"
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Set parent terminal title to reflect current window in tmux session
set -g set-titles on
set -g set-titles-string "#I:#W"

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

set-option -g focus-events on

# ==========================
# ===   Key bindings     ===
# ==========================

# Disable default bindings whose replacements live on other keys elsewhere in
# this config (bind overwrites by itself, so only intentionally-dead keys are
# listed): $ rename-session -> R | , rename-window -> r | % split -> | |
# " split -> _ | ' select-window | n/p next/prev-window -> } { |
# M-n/M-p next/prev with alert | o focus next pane | & kill-window -> X |
# # list-buffers, = choose-buffer -> C-p | z zoom -> + | M-arrows resize pane
unbind "\$"
unbind ,
unbind %
unbind '"'
unbind "'"
unbind n
unbind p
unbind M-n
unbind M-p
unbind o
unbind &
unbind "#"
unbind =
unbind z
unbind M-Up
unbind M-Down
unbind M-Right
unbind M-Left

# Edit configuration and reload. Goes through chezmoi so the source repo stays
# in sync (editing the deployed target directly would cause silent drift).
bind C-e new-window -n 'tmux.conf' "sh -c 'chezmoi edit --apply ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf && tmux display \"Config reloaded\"'"

# Reload tmux configuration
bind C-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind m command-prompt -p "Move BEFORE index:" "move-window -b -t '%%'"

# new window and retain cwd
bind c new-window -c "#{pane_current_path}"

# Prompt to rename window right after it's created
set-hook -g after-new-window 'command-prompt -I "#{window_name}" "rename-window '%%'"'

# Rename session and window
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind R command-prompt -I "#{session_name}" "rename-session '%%'"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Select pane and windows
bind -r \{ previous-window
bind -r \} next-window
bind -r [ select-pane -t :.-
bind -r ] select-pane -t :.+
bind -r Tab last-window   # cycle thru MRU tabs
bind -r C-o swap-pane -D

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Zoom pane
bind + resize-pane -Z

# Link window
bind L command-prompt -p "Link window from (session:window): " "link-window -s %% -a"

# Swap panes back and forth with 1st pane
# When in main-(horizontal|vertical) layouts, the biggest/widest panel is always @1
bind \\ if -F '#{==:#{pane_index},1}' \
     'swap-pane -s "!"' \
     'select-pane -t:.1 ; swap-pane -d -t 1 -s "!"'

# Kill pane/window/session shortcuts
bind x kill-pane
bind X kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Detach from session
bind d detach
bind D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display "Session has only 1 client attached"'

# ================================================
# ===     Copy mode, scroll and clipboard      ===
# ================================================

# Prefer vi style key table
setw -g mode-keys vi

# Native clipboard copy (replaces tmux-yank): v starts a selection, y copies
# it; set-clipboard + the alacritty clipboard terminal-feature push the copy
# to the system clipboard via OSC52. Mouse-drag copy works out of the box.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind p paste-buffer
bind C-p choose-buffer

# trigger copy mode by
bind -n C-s copy-mode

# Scroll up/down by 1 line, half screen, whole screen
bind -T copy-mode-vi M-Up              send-keys -X scroll-up
bind -T copy-mode-vi M-Down            send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp          send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown        send-keys -X halfpage-down
bind -T copy-mode-vi PageDown          send-keys -X page-down
bind -T copy-mode-vi PageUp            send-keys -X page-up

# When scrolling with mouse wheel, scroll 4 rows per tick
bind -T copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 4 scroll-up
bind -T copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 4 scroll-down

# =====================================
# ===    Appearance and status bar  ===
# ======================================

# TokyoNight (night) palette, structure preserved

set -g status-position bottom
set -g status-style 'bg=#16161e,fg=#7aa2f7'
# Bold COPY badge when the active pane is in copy mode. The yellow border cue
# (pane-active-border-style below) is invisible with a single pane, and the
# [0/N] counter is too subtle, so surface the mode in the status bar too.
set -g status-left '#{?pane_in_mode,#[fg=#16161e]#[bg=#e0af68]#[bold] COPY ,}'
set -g status-right ''
set -g status-left-length 20

# The #{@opencode_waiting} segment is the opencode-contextual-notifier marker,
# embedded here (after the leading pad space) so it sits centered inside the
# tab. The plugin only prepends its own copy when the format lacks it.
setw -g window-status-current-format ' #{?@opencode_waiting,#{@opencode_waiting} ,}#I#[fg=#a9b1d6]:#[fg=#c0caf5]#W#[fg=#7dcfff]#F '
setw -g window-status-format ' #{?@opencode_waiting,#{@opencode_waiting} ,}#I#[fg=#3b4261]:#[fg=#565f89]#W#[fg=#3b4261]#F '

# Dim inactive panes: active pane keeps the normal TokyoNight bg while
# inactive ones drop to the darker status-bar shade, so focus is obvious.
setw -g window-style 'bg=#16161e'
setw -g window-active-style 'bg=#1a1b26'

# Panes, prompts, copy mode etc. render stock yellow/green unless themed.
# The active border keeps tmux's stock semantics (yellow-ish in copy mode,
# red-ish when panes are synchronized), just recolored to the palette.
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style '#{?pane_in_mode,fg=#e0af68,#{?synchronize-panes,fg=#f7768e,fg=#7aa2f7}}'
set -g message-style 'bg=#292e42,fg=#c0caf5'
set -g message-command-style 'bg=#292e42,fg=#c0caf5'
set -g mode-style 'bg=#283457'
set -g copy-mode-match-style 'bg=#3d59a1,fg=#c0caf5'
set -g copy-mode-current-match-style 'bg=#ff9e64,fg=#16161e'
set -g clock-mode-colour '#7aa2f7'
set -g display-panes-colour '#565f89'
set -g display-panes-active-colour '#7aa2f7'

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# ============================
# ===       Plugins        ===
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'shmileee/opencode-contextual-notifier'

# Run all plugins' scripts
if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' \
  'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'
