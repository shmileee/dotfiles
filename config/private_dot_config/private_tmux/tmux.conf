# General settings

set -g default-terminal "tmux-256color"

# Reset to defaults first so config reloads don't accumulate duplicate entries
# (set -as appends on every source-file).
set -su terminal-features
set -as terminal-features ",xterm*:RGB"

# clipboard: OSC52 writes, required for native copy-mode -> system clipboard
# now that tmux-yank is gone. cstyle: DECSCUSR passthrough for fish's cursor.
set -as terminal-features ",alacritty*:RGB:usstyle:hyperlinks:clipboard:extkeys:cstyle"

# Forward CSI-u to panes that don't request it, so opencode can tell Shift+Enter
# from Enter. Requires the matching Alacritty binding.
set -s extended-keys always

# Let programs inside tmux (nvim OSC52, remote shells) set the system clipboard.
set -s set-clipboard on

# tmux's cursor reset (Se) is hardcoded to steady block and would override the
# terminal's default. Apps like nvim still override per-pane via DECSCUSR.
set -g cursor-style blinking-block
set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300

# Switch to the most recently active session instead of detaching the client.
set -g detach-on-destroy off
setw -g allow-rename off
setw -g automatic-rename off

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g set-titles on
set -g set-titles-string "#I:#W"

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

set-option -g focus-events on


# Key bindings

# Intentionally dead keys; their replacements are bound further down.
unbind "\$"
unbind ,
unbind %
unbind '"'
unbind "'"
unbind n
unbind p
unbind M-n
unbind M-p
unbind o
unbind &
unbind "#"
unbind =
unbind z
unbind M-Up
unbind M-Down
unbind M-Right
unbind M-Left

# Through chezmoi: editing the deployed target directly would drift from source.
bind C-e new-window -n 'tmux.conf' "sh -c 'chezmoi edit --apply ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf && tmux display \"Config reloaded\"'"

bind C-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind m command-prompt -p "Move BEFORE index:" "move-window -b -t '%%'"

bind c new-window -c "#{pane_current_path}"

# Only for plain shell windows. Windows spawned with an explicit command or name
# (open-url's nvim windows, the C-e editor) skip the prompt.
set-hook -g after-new-window {
  if -F '#{==:#{window_name},fish}' {
    command-prompt -I '#{window_name}' "rename-window -- '%%'"
  }
}

# Brace blocks avoid quote-nesting pitfalls; -- guards names that start
# with a dash.
bind r command-prompt -I "#{window_name}" { rename-window -- "%%" }
bind R command-prompt -I "#{session_name}" { rename-session -- "%%" }

bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

bind -r \{ previous-window
bind -r \} next-window
bind -r [ select-pane -t :.-
bind -r ] select-pane -t :.+
bind -r Tab last-window   # toggle the two most recent
bind -r C-o swap-pane -D  # rotate panes

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind + resize-pane -Z  # zoom toggle

# link-window: show one window in two sessions at once.
bind L command-prompt -p "Link window from (session:window): " "link-window -s %% -a"

# Agentic task launcher; see ~/bin/agent-workon.
bind C-g display-popup -E -w 80% -h 70% agent-workon

# A new session exists to host agent task windows, so chain the task launcher.
bind S command-prompt -p "new session:" { new-session -A -s "%%" ; display-popup -E -w 80% -h 70% agent-workon }

# Ephemeral by design: Enter/1-9 jump and close it, p peeks without closing.
bind C-d display-popup -E -w 90% -h 80% "workmux dashboard"

# In main-(horizontal|vertical) layouts the biggest pane is always @1.
bind \\ if -F '#{==:#{pane_index},1}' \
     'swap-pane -s "!"' \
     'select-pane -t:.1 ; swap-pane -d -t 1 -s "!"'

bind x kill-pane
bind X kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

bind d detach
bind D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display "Session has only 1 client attached"'


# Copy mode, scroll and clipboard

setw -g mode-keys vi

# Native clipboard copy (replaces tmux-yank): set-clipboard plus the alacritty
# clipboard feature push the selection to the system clipboard via OSC52.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind p paste-buffer
bind C-p choose-buffer

bind -n C-s copy-mode  # -n: works without the prefix

bind -T copy-mode-vi M-Up              send-keys -X scroll-up
bind -T copy-mode-vi M-Down            send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp          send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown        send-keys -X halfpage-down
bind -T copy-mode-vi PageDown          send-keys -X page-down
bind -T copy-mode-vi PageUp            send-keys -X page-up

bind -T copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 4 scroll-up
bind -T copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 4 scroll-down

# Appearance and status bar
# TokyoNight (moon) palette.

set -g status-position bottom
set -g status-style 'bg=#1e2030,fg=#82aaff'

# The border cue below is invisible with a single pane and [0/N] is too subtle,
# so surface copy mode in the status bar too.
set -g status-left '#{?pane_in_mode,#[fg=#1b1d2b]#[bg=#ffc777]#[bold] COPY ,}'
set -g status-right ''
set -g status-left-length 20

# @opencode_waiting is the opencode-contextual-notifier marker, placed after the
# pad space so it sits inside the tab; the plugin only prepends it when absent.
setw -g window-status-current-format ' #{?@opencode_waiting,#{@opencode_waiting} ,}#I#[fg=#828bb8]:#[fg=#c8d3f5]#W#[fg=#86e1fc]#F '
setw -g window-status-format ' #{?@opencode_waiting,#{@opencode_waiting} ,}#I#[fg=#3b4261]:#[fg=#636da6]#W#[fg=#3b4261]#F '

# Dim inactive panes to the darker status-bar shade.
setw -g window-style 'bg=#1e2030'
setw -g window-active-style 'bg=#222436'

# Active border keeps tmux's stock semantics (yellow in copy mode, red when
# panes are synchronized), recolored to the palette.
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style '#{?pane_in_mode,fg=#ffc777,#{?synchronize-panes,fg=#ff757f,fg=#82aaff}}'

# fill= clears the rest of the status line; without it the prompt is only as
# wide as its text and the window list stays visible beside it.
set -g message-style 'bg=#2f334d,fg=#c8d3f5,fill=#2f334d'
set -g message-command-style 'bg=#2f334d,fg=#c8d3f5,fill=#2f334d'
set -g mode-style 'bg=#2d3f76'
set -g copy-mode-match-style 'bg=#3e68d7,fg=#c8d3f5'
set -g copy-mode-current-match-style 'bg=#ff966c,fg=#1b1d2b'
set -g clock-mode-colour '#82aaff'
set -g display-panes-colour '#636da6'
set -g display-panes-active-colour '#82aaff'

set-option -g renumber-windows on


# Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'shmileee/opencode-contextual-notifier'

if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' \
  'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'

# `on` is idempotent, so config reloads are safe; -b avoids blocking config load.
if-shell 'command -v workmux > /dev/null' \
  'run-shell -b "workmux sidebar on"'
