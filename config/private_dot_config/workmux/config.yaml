# workmux global config (evaluated at v0.1.256). Used by agent-workon/
# agent-workdone (~/bin) and the tmux prefix+C-g binding.
#
# Agent status tracking runs alongside opencode-contextual-notifier: the
# vendored opencode plugin (private_opencode/plugins/workmux-status.ts) feeds
# workmux's dashboard/sidebar. status_format false keeps the status icons out
# of the tmux window names (the dashboard reads workmux state, not the
# format); the notifier's @opencode_waiting segment in tmux.conf remains the
# only window-name indicator.
status_format: false

# Sibling of the repo: <repo>-worktrees/<slug>. Relative paths resolve against
# the project root, hence the leading ../
worktree_dir: '../{project}-worktrees'

# Window name = pure task slug (window = branch = worktree dir).
window_prefix: ''

# FiraCode Nerd Font is the terminal font; answering this in config keeps the
# first-run wizard from hijacking the agent-workon popup on fresh machines.
nerdfont: true

panes:
  # opencode is a fish wrapper function (path-scoped OPENCODE_CONFIG routing);
  # workmux runs pane commands through the default shell, so it applies here.
  - command: opencode

# Autostarted from tmux.conf (run-shell "workmux sidebar on").
sidebar:
  position: left
  width: 30
  layout: compact

# Dashboard/sidebar recolored to the TokyoNight moon palette used by
# alacritty, tmux, and the rest of the setup.
theme:
  mode: dark
  custom:
    bg: '#2f334d'
    highlight_row_bg: '#2d3f76'
    fg: '#c8d3f5'
    current_worktree_fg: '#82aaff'
    dimmed: '#636da6'
    border: '#3b4261'
    help_border: '#3b4261'
    help_muted: '#636da6'
    header: '#82aaff'
    keycap: '#c099ff'
    accent: '#82aaff'
    info: '#86e1fc'
    success: '#c3e88d'
    warning: '#ffc777'
    danger: '#ff757f'
