# Vendored from derailed/k9s:
# https://github.com/derailed/k9s/blob/master/plugins/external-secrets.yaml
#
# Requires: kubectl. Forces ESO to re-read the backing store (Vault) for the
# selected secret instead of waiting out its refreshInterval.
plugins:
  refresh-external-secrets:
    shortCut: Shift-R
    confirm: false
    scopes:
      - externalsecrets
    description: Refresh the externalsecret
    command: bash
    background: true
    args:
      - -c
      - "kubectl annotate externalsecrets.external-secrets.io --context $CONTEXT -n $NAMESPACE $NAME force-sync=$(date +%s) --overwrite"
  refresh-push-secrets:
    shortCut: Shift-R
    confirm: false
    scopes:
      - pushsecrets
    description: Refresh the pushsecret
    command: bash
    background: true
    args:
      - -c
      - "kubectl annotate pushsecrets.external-secrets.io --context $CONTEXT -n $NAMESPACE $NAME force-sync=$(date +%s) --overwrite"
