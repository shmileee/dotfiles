# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.65.0/schema/config.json
os:
  # Preset replaces the manual edit template; auto-detects nvim-remote when
  # lazygit is launched from inside a Neovim terminal ($NVIM set).
  editPreset: nvim

git:
  # `sh -c` only caps the line length: delta never wraps in unified mode
  # (dandavison/delta#1966), so lazygit soft-wraps instead and the continuation
  # row starts at column 0 without delta's gutter, breaking the numbering.
  # lazygit exports COLUMNS = main panel width; -12 covers the widest gutter
  # (12 cols once line numbers reach 5 digits). Caveat: lazygit re-shows the
  # cached diff after a resize, so overlong lines can spill once.
  diffRenderers:
    - name: delta
      command: sh -c 'w=${COLUMNS:-80}; exec delta --dark --paging=never --line-numbers --max-line-length=$((w - 12)) --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"'
    - type: rawGit
      name: default

  # Prefill commit subject from branch name, e.g. feature/JIRA-123-foo -> "[JIRA-123] "
  commitPrefix:
    - pattern: "^\\w+\\/(\\w+-\\w+).*"
      replace: "[$1] "

gui:
  # FiraCode Nerd Font is installed -> enable v3 icons.
  nerdFontsVersion: "3"
  filterMode: fuzzy

  # Tokyo Night (moon) - matches the Neovim colorscheme.
  # Source: https://github.com/folke/tokyonight.nvim/blob/main/extras/lazygit/tokyonight_moon.yml
  theme:
    activeBorderColor:
      - "#ff966c"
      - "bold"
    inactiveBorderColor:
      - "#589ed7"
    searchingActiveBorderColor:
      - "#ff966c"
      - "bold"
    optionsTextColor:
      - "#82aaff"
    selectedLineBgColor:
      - "#2d3f76"
    cherryPickedCommitFgColor:
      - "#82aaff"
    cherryPickedCommitBgColor:
      - "#c099ff"
    markedBaseCommitFgColor:
      - "#82aaff"
    markedBaseCommitBgColor:
      - "#ffc777"
    unstagedChangesColor:
      - "#c53b53"
    defaultFgColor:
      - "#c8d3f5"

update:
  # Check for updates silently in the background (Homebrew still owns installs).
  method: background
