# Pin ~/ghq/personalgit to the PERSONAL account; --user ignores inherited tokens.
# Fall back to GITHUB_TOKEN when no local login exists, including in Actions.
# If neither source exists, tolerate an empty GH_TOKEN ("unset" for gh).
# Cache 1h to avoid keychain access on every prompt; after `gh auth login`,
# run `mise cache clear`.
# Long-lived processes (tmux panes, agents) keep the token they started with.
[env]
GH_TOKEN = "{{ exec(command='gh auth token --user shmileee 2>/dev/null || printenv GITHUB_TOKEN 2>/dev/null || true', cache_key='gh-token-shmileee', cache_duration='1h') }}"
